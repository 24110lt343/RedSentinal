[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redsentinal"
version = "0.1.0"
description = "Agentic AI Powered Web Security Framework"
requires-python = ">=3.11"
dependencies = [
    "rich",
    "typer",
    "python-dotenv",
    "openai"
]

[project.scripts]
redsentinal = "redsentinal.main:app"

[tool.setuptools.packages.find]
where = ["src"]